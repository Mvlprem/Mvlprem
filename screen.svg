<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 360" width="100%">
  <defs>
    <!-- Phosphor Glow -->
    <filter id="crt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Scanlines -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.6" opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .terminal-text { font-family: 'Courier New', monospace; fill: #22ee5b; filter: url(#crt-glow); }
    .dim-text { font-family: 'Courier New', monospace; fill: #199c3d; font-size: 11px; }
  </style>

  <!-- Dark CRT Screen Background -->
  <rect width="100%" height="100%" rx="14" fill="#031006" stroke="#000000" stroke-width="2"/>
  <rect width="100%" height="100%" rx="14" fill="url(#scanlines)" pointer-events="none"/>

  <!-- RobCo Header -->
  <text x="50%" y="34" text-anchor="middle" class="terminal-text" font-size="12" font-weight="bold" letter-spacing="2">GNU/LINUX OPERATING SYSTEM</text>
  <text x="50%" y="50" text-anchor="middle" class="dim-text">SECURE ACCESS TERMINAL // TTY1</text>
  <line x1="30" y1="62" x2="620" y2="62" stroke="#199c3d" stroke-width="1" opacity="0.3"/>

  <!-- Selected Menu Item Bar -->
  <rect x="45" y="90" width="560" height="28" fill="#22ee5b" opacity="0.18" rx="2"/>

  <!-- Menu Content -->
  <text x="55" y="109" class="terminal-text" font-size="14" font-weight="bold">&gt; User: Mvlprem</text>
  <text x="55" y="150" class="terminal-text" font-size="13">  Focus: Threat Detection &amp; Adversary Emulation</text>
  <text x="55" y="184" class="terminal-text" font-size="13">  Labs     : TryHackMe | HackTheBox</text>
  <text x="55" y="218" class="terminal-text" font-size="13">  Status: Analyzing Logs &amp; Bypassing Defenses</text>
  <text x="55" y="252" class="terminal-text" font-size="13">  Endpoint: https://mvlprem.in</text>

  <!-- GRUB Footer -->
  <line x1="30" y1="295" x2="620" y2="295" stroke="#199c3d" stroke-width="1" opacity="0.3"/>
  <text x="50%" y="325" text-anchor="middle" class="dim-text" letter-spacing="1">Use ↑ and ↓ keys to change selection, Enter to confirm</text>
</svg>
